name: CI

# Kiểm tra chất lượng cho mọi PR và mọi nhánh khác main. Chạy trên Emulator, không dùng secret, không chạm Firebase production.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Quét secret trong mã nguồn
        run: node scripts/scan-secrets.mjs
      - name: Kiểm tra lỗ hổng dependency
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Cài Firebase CLI (phiên bản cố định) cho Emulator
        run: npm install -g firebase-tools@15.34.2
      - name: Test Security Rules
        run: npm run test:rules
      - name: Test tích hợp (Auth + Firestore Emulator)
        run: npm run test:integration
      - run: npm run build
      - name: Cài trình duyệt cho E2E
        run: npx playwright install --with-deps chromium
      - name: E2E trên trình duyệt thật (Emulator)
        run: npm run test:e2e
        env:
          PW_CHANNEL: ''
      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
